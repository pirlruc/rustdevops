version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: gitsubmodule
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 7
