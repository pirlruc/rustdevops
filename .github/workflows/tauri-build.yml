name: Tauri build

on:
  workflow_call:
    inputs:
      frontend_directory:
        description: Directory that contains package.json and the Tauri CLI
        type: string
        default: .
        required: false
      bundles:
        description: Comma-separated Tauri bundle types
        type: string
        default: deb
        required: false
      node_version:
        description: Node version
        type: string
        default: "24"
        required: false
      signing:
        description: Require TAURI_SIGNING_PRIVATE_KEY
        type: boolean
        default: false
        required: false
      devops_ref:
        description: Commit or tag of this repo matching the uses pin (CI-034)
        type: string
        default: ""
        required: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Updater signing key. Required when signing is true.
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password for the updater signing key
        required: false

permissions: {}

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require devops_ref for cross-repo callers
        env:
          REF: ${{ inputs.devops_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${REPO}" != "pirlruc/rustdevops" ] && [ -z "${REF}" ]; then
            echo "CI-034: pass devops_ref equal to the uses pin" >&2
            exit 1
          fi

      - name: Require a signing key when signing is on
        if: inputs.signing
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ]; then
            echo "signing is true and TAURI_SIGNING_PRIVATE_KEY is empty" >&2
            exit 1
          fi

      - name: Install Linux webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.85.0

      - name: Install frontend dependencies
        working-directory: ${{ inputs.frontend_directory }}
        run: npm ci

      - name: Build the Linux bundle
        working-directory: ${{ inputs.frontend_directory }}
        env:
          BUNDLES: ${{ inputs.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles "${BUNDLES}"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-linux
          path: ${{ inputs.frontend_directory }}/src-tauri/target/release/bundle
          retention-days: 14
