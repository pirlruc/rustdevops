name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  infra-lint:
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    with:
      blocking: true
      run_shfmt: true
      shell_scripts: scripts/*.sh
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      mount_runner_git: false

  pins:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-pins-verify.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    with:
      pin_script: scripts/check-submodule-pins.sh
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e

  docs:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    with:
      blocking: true
      shell_scripts: scripts/*.sh
      run_link_lint: true
      run_hygiene: true
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e

  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    with:
      blocking: true
      working_directory: .
      scripts_ref: 5d8b83da2f8f0c0c1bd894ef920619fe127c033e
      container_image: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:dff4ec57d90046a7283aafc314298380be82bfeccb9ad0f1b36c4ebe74aabe78
      install_runner_packages: true
      mount_runner_git: false

  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@5d8b83da2f8f0c0c1bd894ef920619fe127c033e
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  smoke:
    permissions:
      contents: read
    # Local reusable workflow. GitHub requires ./ for workflow_call.
    # zizmor: ignore[self-repository]
    uses: ./.github/workflows/rust-quality.yml
    with:
      working_directory: fixtures/smoke
