name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/ops-repo-ci.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f # v6.10.0
    with:
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
      shell_scripts: scripts/*.sh
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  smoke:
    permissions:
      contents: read
    # Local reusable workflow. GitHub requires ./ for workflow_call.
    uses: ./.github/workflows/rust-quality.yml # zizmor: ignore[self-repository]
    with:
      working_directory: fixtures/smoke
